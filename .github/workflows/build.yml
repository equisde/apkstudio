name: Build

on:
  push:
    branches: [ master, feature/antisplit ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (MSVC Fresh)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: "win64_msvc2022_64"

      - name: Clean and Configure
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        
      - name: Deploy
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
          windeployqt --release --no-translations build\bin\Release\ApkStudio.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-Windows-MSVC
          path: build\bin\Release\

  build-linux:
    name: Build Linux (Fresh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-x11-0 fuse ninja-build

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"

      - name: Clean and Configure
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp build/bin/ApkStudio AppDir/usr/bin/apkstudio
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/apkstudio --plugin qt --output appimage

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-Linux-AppImage
          path: ApkStudio*.AppImage

  build-macos:
    name: Build macOS (Fresh)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"

      - name: Clean and Configure
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -GNinja

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle and DMG
        run: |
          ${{ env.Qt6_DIR }}/bin/macdeployqt build/bin/ApkStudio.app -dmg
          mv build/bin/ApkStudio.dmg ApkStudio-macOS.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-macOS-DMG
          path: ApkStudio-macOS.dmg
