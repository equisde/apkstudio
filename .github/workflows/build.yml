name: Build

on:
  push:
    branches:
      - master
      - feature/antisplit
  pull_request:
    branches:
      - master
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (Fresh)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          # Cache disabled for fresh environment

      - name: Clean Environment
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path bin) { Remove-Item -Recurse -Force bin }
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja
        env:
          CMAKE_GENERATOR: Ninja

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
          $ExePath = "build/bin/Release/ApkStudio.exe"
          if (!(Test-Path $ExePath)) { $ExePath = "build/Release/ApkStudio.exe" }
          windeployqt --release --no-translations --no-opengl-sw $ExePath

      - name: Archive
        shell: pwsh
        run: |
          $SourceDir = "build/bin/Release"
          if (!(Test-Path $SourceDir)) { $SourceDir = "build/Release" }
          Compress-Archive -Path "$SourceDir\*" -DestinationPath ApkStudio-Windows-x64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-Windows-x64
          path: ApkStudio-Windows-x64.zip

  build-linux:
    name: Build Linux (Fresh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 fuse ninja-build

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"

      - name: Fresh Configure & Build
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build --config Release

      - name: Prepare AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp build/bin/ApkStudio AppDir/usr/bin/apkstudio
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/apkstudio --plugin qt --output appimage

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-Linux-x64
          path: ApkStudio*.AppImage

  build-macos:
    name: Build macOS (Fresh)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"

      - name: Fresh Build
        run: |
          rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -GNinja
          cmake --build build --config Release

      - name: Bundle
        run: |
          ${{ env.Qt6_DIR }}/bin/macdeployqt build/bin/ApkStudio.app -dmg
          mv build/bin/ApkStudio.dmg ApkStudio-macOS.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-macOS-x64
          path: ApkStudio-macOS.dmg
