name: Build Windows

on:
  push:
    branches:
      - feature/antisplit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Fresh Build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          cache: false

      - name: Install Ninja
        run: choco install ninja

      - name: Clean environment
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path bin) { Remove-Item -Recurse -Force bin }
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja
        shell: pwsh

      - name: Build
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: Deploy Qt
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
          $ExePath = "build/bin/ApkStudio.exe"
          if (!(Test-Path $ExePath)) { $ExePath = "build/ApkStudio.exe" }
          windeployqt --release --no-translations --no-opengl-sw $ExePath

      - name: Package
        shell: pwsh
        run: |
          $TargetDir = "build/bin"
          if (!(Test-Path $TargetDir)) { $TargetDir = "build" }
          # Copy everything to a staging folder to avoid nesting
          mkdir dist
          cp "$TargetDir/*" dist/ -Recurse -Force
          Compress-Archive -Path "dist/*" -DestinationPath ApkStudio-Windows-x64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ApkStudio-Windows-Binaries
          path: ApkStudio-Windows-x64.zip
          retention-days: 7